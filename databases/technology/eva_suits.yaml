  description: EVA suit designed for repair and construction work. Built-in tools and enhanced grip systems.
  defense: 30
  mobility: Medium
  duration_hours: 36
  features:
  - Built-in tool set
  - Enhanced grip (work in zero-G)
  - Welding torch
  - Material scanner
  - Extra storage
  rp_cost: 6000
