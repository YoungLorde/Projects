    INT: 7
    STR: 5
- id: eva_011
  name: Medical EVA
  tier: 3
  type: Support
  description: EVA with integrated medical systems. Can diagnose and treat injuries in the field.
  defense: 25
  mobility: Medium
  duration_hours: 30
  features:
  - Diagnostic scanner
  - Auto-injector system
  - Surgical tools
  - Bio-monitor for patient
  - Drug synthesizer
  rp_cost: 8000
  requirements:
    INT: 8
    PER: 6
- id: eva_012
  name: Aquatic EVA
  tier: 3
  type: Underwater
  description: EVA optimized for underwater operation. Pressure-rated to 5000m. Integrated propulsion.
  defense: 40
  mobility: High (underwater)
  duration_hours: 24
  features:
  - Depth rating 5000m
  - Water jet propulsion
  - Sonar
  - Pressure equalization
  - Underwater communication
  rp_cost: 7000
  requirements:
    END: 7
    AGI: 5
earth_eva_development:
  current_status: 'Earth''s EVA technology is approximately equivalent to Tier 0-1. The Accord''s New Geneva facility has
    produced ~200 Emergency Vacuum Suits and ~30 Standard EVA Suits. The Scholar''s Compact is researching Tier 2 designs
    but estimates 2-3 years to blueprint completion. Most Earth Travellers who need EVA suits must purchase them from alien
    traders at enormous cost.

    '
  development_timeline:
    year_1: Emergency Vacuum Suits (Tier 0) — basic survival only
    year_2_3: Standard EVA Suits (Tier 1) — reliable space operations
    year_5_8: Combat EVA Suits (Tier 2) — military space capability (estimated)
    year_15_plus: Advanced Explorer EVA (Tier 3) — full exploration capability (estimated)
    year_50_plus: Tier 4+ equivalent (highly speculative)
  key_challenges:
  - 'Materials: System-enhanced polymers and composites are scarce on Earth'
  - 'Knowledge: Earth lacks 800+ years of alien EVA R&D'
  - 'Manufacturing: No dedicated EVA production facility exists yet'
  - 'Testing: Space testing requires existing EVA suits (chicken-and-egg problem)'
  - 'Cost: Each prototype costs millions of RP in materials alone'
