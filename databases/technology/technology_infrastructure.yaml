---
category: technology_and_infrastructure
description: >
  Reality-grounded technology, infrastructure, logistics, and research systems
  in the RP Conversion universe. While the Game System provides supernatural
  abilities, the physical world still operates on real physics. Travellers must
  deal with actual engineering, logistics, and infrastructure challenges.

# ============================================
# TECHNOLOGY TIERS
# ============================================
technology_overview:
  principle: >
    Technology in the RP Conversion universe is a blend of pre-System human
    technology, System-enhanced engineering, and alien technological traditions.
    The System does NOT replace physics — it augments it. Gravity still pulls,
    thermodynamics still applies, and you still need to eat, drink, and breathe.
    System enhancements make existing technology more efficient, durable, and
    powerful, but they don't break fundamental physical laws.

  tech_levels:
    - level: "Pre-System Baseline"
      description: "Earth technology as it existed before System activation. Conventional engines, electronics, materials."
      examples: "Cars, firearms, computers, radio, solar panels"
      availability: "Abundant on Earth, obsolete elsewhere"

    - level: "System-Enhanced Conventional"
      description: "Pre-System technology upgraded with System energy. More durable, efficient, and powerful."
      examples: "System-enhanced firearms (RP ammo), reinforced vehicles, enhanced communications"
      availability: "Common among Tier 0-2 Travellers"

    - level: "System-Native Technology"
      description: "Technology designed from the ground up using System principles. Cannot function without System energy."
      examples: "Energy shields, dimensional storage, System crafting stations, RP generators"
      availability: "Common among Tier 3-5 Travellers"

    - level: "Advanced System-Integration"
      description: "Technology that deeply integrates with the System's dimensional and energy manipulation capabilities."
      examples: "Dimensional drives, gravity manipulation, pocket dimension expansion, quantum research"
      availability: "Tier 6+ Travellers and advanced alien civilizations"

    - level: "Theoretical/Ancient"
      description: "Technology from ancient races or theoretical developments beyond current understanding."
      examples: "Reality manipulation, System creation/modification, dimensional construction"
      availability: "Ancient race artifacts only, not reproducible"

# ============================================
# INFRASTRUCTURE SYSTEMS
# ============================================
infrastructure:
  power_generation:
    - id: TECH-001
      name: "RP Power Converter"
      tier_requirement: 1
      description: >
        Converts RP into electrical energy. The most common power source
        in the System universe. 1 RP = approximately 10 kWh of electricity.
        Simple, reliable, and available to any Traveller with RP to spend.
        The backbone of post-System civilization's power grid.
      efficiency: "95% conversion rate"
      cost: "1 RP per 10 kWh"
      notes: "Makes fossil fuels and nuclear power obsolete for small-scale operations."

    - id: TECH-002
      name: "Solar Enhancement Array"
      tier_requirement: 2
      description: >
        System-enhanced solar panels that convert sunlight at 85% efficiency
        (vs. pre-System ~20%). The System energy coating allows panels to
        absorb a broader spectrum of radiation. Produces both electricity
        and small amounts of RP (1 RP per hour per panel in direct sunlight).
      efficiency: "85% solar conversion + 1 RP/hour passive"
      cost: "5,000 RP per panel"
      notes: "Free energy once installed. Essential for settlement sustainability."

    - id: TECH-003
      name: "Dungeon Core Tap"
      tier_requirement: 4
      description: >
        A device that siphons ambient System energy from a dungeon's core
        without destroying it. Provides enormous power output but risks
        destabilizing the dungeon. Illegal in most jurisdictions. Used
        by factions that control dungeon territory.
      efficiency: "Massive — powers a small city"
      cost: "500,000 RP to construct"
      notes: "Controversial — some argue it weakens dungeon cores and spawns unstable creatures."

  water_systems:
    - id: TECH-004
      name: "Atmospheric Water Generator"
      tier_requirement: 1
      description: >
        System-enhanced device that extracts water from air, even in
        low-humidity environments. Uses System energy to accelerate
        condensation. Output: 50 liters/day per unit in temperate
        climates, 10 liters/day in arid conditions.
      cost: "2,000 RP per unit"
      notes: "Essential for settlements without natural water sources."

    - id: TECH-005
      name: "System Purification Filter"
      tier_requirement: 1
      description: >
        Filters that use System energy to remove ALL contaminants from
        water, including System-anomaly radiation, biological agents,
        and chemical pollutants. Converts any liquid (including toxic
        waste) to potable water. Filter lifespan: 1 year.
      cost: "1,000 RP per filter"
      notes: "Made pre-System water treatment obsolete. Simple, cheap, reliable."

  food_production:
    - id: TECH-006
      name: "System-Enhanced Agriculture"
      tier_requirement: 1
      description: >
        Farming techniques that use System energy to accelerate crop
        growth (5x normal speed), enhance nutritional content, and
        protect against pests. Requires a Traveller with farming
        knowledge and at least INT 2. A single System-enhanced farm
        can feed 100 people from 1 hectare.
      cost: "10 RP/day per hectare maintenance"
      notes: "Wanderers with farming experience are highly valued for this skill."

    - id: TECH-007
      name: "Nutrient Synthesizer"
      tier_requirement: 3
      description: >
        Device that converts raw organic matter and RP into nutritious
        food paste. Not pleasant to eat but provides complete nutrition.
        Output: enough food for 10 people per day per unit. Used in
        military operations and emergency situations.
      cost: "50,000 RP per unit, 5 RP/day operating cost"
      notes: "Functional but depressing. Nobody eats synthesized food by choice."

    - id: TECH-008
      name: "Hunting & Monster Processing"
      tier_requirement: 0
      description: >
        Many System creatures are edible after proper processing. The
        Harvest ability identifies safe-to-eat parts. Monster meat
        often provides temporary stat buffs when cooked properly.
        A skilled hunter-chef can feed a community and provide
        combat advantages through food buffs.
      cost: "Free (requires hunting)"
      notes: "Monster cuisine is an entire culinary tradition on older System worlds."

  communication:
    - id: TECH-009
      name: "System Relay Tower"
      tier_requirement: 2
      description: >
        Amplifies System Communication range. A network of relay towers
        provides continent-wide communication capability. Each tower
        covers a 500km radius. Building a relay network is one of the
        first infrastructure priorities for any settlement.
      cost: "25,000 RP per tower"
      notes: "The backbone of post-System communication. Factions that control relay networks control information."

    - id: TECH-010
      name: "Quantum Entanglement Communicator"
      tier_requirement: 6
      description: >
        Instantaneous communication regardless of distance using
        System-enhanced quantum entanglement. Each communicator is
        paired with exactly one other communicator during manufacturing.
        Messages are uninterceptable. Limited to text and voice.
      cost: "5,000,000 RP per pair"
      notes: "The gold standard for secure long-range communication. Military and diplomatic use."

  transportation:
    - id: TECH-011
      name: "System-Enhanced Roads"
      tier_requirement: 2
      description: >
        Roads built or upgraded with System-enhanced materials. Self-
        repairing surface, weather-resistant, monster-deterrent (low-tier
        creatures avoid System-enhanced roads). Speed bonus: +20% for
        vehicles on System roads. Building cost is high but maintenance
        is minimal.
      cost: "100 RP per meter of road"
      notes: "The Reclamation Corps has restored 50,000km of roads on Earth."

    - id: TECH-012
      name: "Waypoint Gate"
      tier_requirement: 5
      description: >
        Permanent teleportation gate between two fixed locations. Requires
        massive RP investment to establish but allows instant travel
        between connected points. Each gate pair requires 10,000,000 RP
        to construct and 1,000 RP/day to maintain. Travel cost: 100 RP
        per person per use.
      cost: "10,000,000 RP to construct, 1,000 RP/day maintenance"
      notes: "Only wealthy factions can afford Waypoint Gates. They define trade routes."

# ============================================
# LOGISTICS & SUPPLY CHAINS
# ============================================
logistics:
  trade_routes:
    - id: LOG-001
      name: "Earth Continental Trade Network"
      scope: planetary
      description: >
        Network of trade routes connecting Earth's major settlements.
        Protected by Reclamation Corps patrols and Iron Caravan escorts.
        Handles food, materials, equipment, and RP transfers. Routes
        follow restored road networks and avoid known dungeon breach zones.
      major_routes:
        - "New Geneva → Port Meridian (maritime + overland)"
        - "Fort Haven → The Archive (eastern seaboard)"
        - "Port Meridian → The Crossroads (maritime)"
      hazards: "Raiders, dungeon breaches, monster migrations, faction border disputes"

    - id: LOG-002
      name: "The Spine"
      scope: interstellar
      description: >
        Main interstellar trade route connecting 15 major worlds across
        8 star systems. Maintained by the Iron Caravan and protected by
        multiple factions under mutual treaty. The economic backbone of
        known civilization. Handles 60% of all inter-system trade.
      major_stops: ["Kael Prime", "Varak", "Nexar outpost", "The Forge", "Radiance"]
      hazards: "Pirates, void creatures, dimensional anomalies, political disputes"

  supply_chain_elements:
    raw_materials: >
      System-enhanced materials must be harvested from specific sources:
      monster drops, dungeon loot, mining (System-enhanced deposits),
      or alien trade. Raw material supply is the foundation of all
      manufacturing. Control raw material sources = control the economy.

    manufacturing: >
      Crafting and manufacturing require: materials + crafting skill +
      workspace + recipes/blueprints. The Forge Masters guild sets
      quality standards. Mass production is possible with factory-scale
      System-enhanced workshops but quality decreases compared to
      individual crafting.

    distribution: >
      Getting goods from production to consumer requires: transportation
      (vehicles, convoys), route security (escorts, patrols), storage
      (warehouses, System inventory), and market access (trade hubs,
      auctions). The Iron Caravan handles most inter-settlement
      distribution.

    currency_flow: >
      RP is the universal currency. It flows from: dungeon clearing
      (primary source), monster hunting, quest completion, trade,
      and passive generation (RP Circulation ability, EXP farms).
      RP flows to: equipment purchase, vehicle upgrades, crafting,
      consumables, services, and taxes/tithes. The economy is
      fundamentally based on combat and risk.

# ============================================
# RESEARCH & DEVELOPMENT
# ============================================
research:
  research_fields:
    - id: RES-001
      name: "System Mechanics"
      description: >
        Understanding how the Game System works at a fundamental level.
        What are the rules? Where are the limits? Can the rules be bent?
        The Scholar's Compact leads this field. Key discoveries include:
        System notification patterns, stat cap formulas, and dungeon
        spawn algorithms.
      current_frontier: "Understanding why the System activated and who created it"
      difficulty: "Extremely High — the System actively resists deep analysis"

    - id: RES-002
      name: "Vehicle Core Engineering"
      description: >
        Studying how Vehicle Cores function, bond, and can be optimized.
        The Kael'thari lead this field with their artificial core
        production. Current limits: artificial cores cannot exceed Tier 2.
        Natural core optimization can add 10-20% effective performance.
      current_frontier: "Artificial Tier 3+ core production"
      difficulty: "Very High — core structure becomes exponentially complex above Tier 2"

    - id: RES-003
      name: "EVA Suit Development"
      description: >
        Designing and improving suits for extra-vehicular activity in
        space. Key challenges: radiation shielding, oxygen recycling,
        mobility, and System integration. The Accord has the most
        advanced EVA suit program on Earth. Alien civilizations have
        EVA suits 10-50x more advanced than Earth's best.
      current_frontier: "Self-sustaining EVA suits with indefinite life support"
      difficulty: "High — materials and System integration require significant investment"
      earth_status: >
        Earth is 800+ years behind alien EVA technology. Mohamed and
        other Earth Travellers must either: research and produce their
        own (slow, expensive), purchase from alien traders (extremely
        expensive), or salvage from alien wrecks (dangerous but possible).

    - id: RES-004
      name: "Dimensional Engineering"
      description: >
        Understanding and manipulating the dimensional spaces used by
        Vehicle pocket dimensions, dungeons, and dimensional travel.
        Key applications: pocket dimension expansion, dimensional
        drives, dimensional storage, and portal creation.
      current_frontier: "Stable dimensional rifts for permanent inter-world travel"
      difficulty: "Extremely High — dimensional physics are poorly understood"

    - id: RES-005
      name: "Biological Enhancement"
      description: >
        Using System energy to enhance biological organisms beyond
        natural limits. Applications: healing, stat enhancement,
        lifespan extension, species hybridization. The Grey Medics
        and Thornveil lead this field.
      current_frontier: "Permanent stat enhancement without crystals"
      difficulty: "High — the System limits biological modification"

    - id: RES-006
      name: "Weapons & Armor Development"
      description: >
        Creating better equipment using System-enhanced materials and
        techniques. The Forge Masters guild leads conventional
        development. Military factions drive applied research.
      current_frontier: "System-reactive equipment that adapts to threats in real-time"
      difficulty: "Moderate — well-understood field with room for innovation"

    - id: RES-007
      name: "Ancient Race Archaeology"
      description: >
        Studying the ruins, artifacts, and legacy of extinct ancient
        civilizations. Key goal: understanding what happened to them
        and recovering their technology. The Architects' ruins are
        the most studied. The First Travellers' legacy is the most
        coveted.
      current_frontier: "Decoding Architect language and purpose"
      difficulty: "Very High — ancient technology often resists modern analysis"

  research_process: >
    Research in the RP Conversion universe follows a modified scientific
    method enhanced by the System:
    1. OBSERVATION: Identify a phenomenon or need
    2. ANALYSIS: Use System Analyze and research equipment to gather data
    3. HYPOTHESIS: Formulate a theory (INT-dependent success rate)
    4. EXPERIMENTATION: Test the theory (requires materials, time, RP)
    5. SYSTEM VALIDATION: The System confirms or denies the result
    6. BLUEPRINT: Successful research produces a reusable blueprint
    7. PRODUCTION: Blueprint enables repeatable creation/application

    Research speed depends on: INT stat, equipment quality, material
    availability, and existing knowledge base. The Scholar's Compact
    has published research acceleration tables.
