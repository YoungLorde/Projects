# Insectoid Races Database

races:

  - id: race_i001
    name: "Chitraki"
    classification: insectoid
    homeworld: "The Hive Nexus"
    universe_origin: "Swarm Expanse"
    avg_height_cm: 170
    avg_lifespan_years: 50
    skin_tones: ["chitin black", "amber", "iridescent green"]
    distinguishing_features: "Exoskeletal armor, compound eyes, mandibles, four arms, vestigial wings (non-functional for most)"
    base_stats: { STR: 7, AGI: 9, END: 8, INT: 6, PER: 10, LCK: 2, SYS: 3 }
    racial_ability: "Hive Signal — communicate silently with any Chitraki within 1km via pheromone burst"
    culture: "Eusocial hive structure. Queens direct, soldiers fight, workers build. Individuality is emerging in Traveller-class Chitraki, causing cultural upheaval."
    weakness: "Isolated individuals suffer 'Severance Sickness' — stat debuffs when away from hive-mates too long."
    known_for: "Swarm tactics, tunnel engineering, rapid construction, overwhelming numbers"
    traveller_percentage: 65

