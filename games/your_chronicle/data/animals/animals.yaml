collection: animals
description: >
  Normal (non-hostile or semi-hostile) animal NPCs for Your Chronicle. Animals can
  be hunted for materials, tamed as companions/mounts, farmed/ranched by villagers,
  or simply populate the world. Each notes what it yields and whether it is tameable.
animals:
