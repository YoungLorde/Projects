collection: enemies
description: >
  Enemy roster for Your Chronicle: 24 regular enemy TYPES (each scales across the
  dungeon rank ladder), plus the named dungeon bosses and open-world bosses. Stats
  shown are TYPE base values at rank index 0; the dungeon scaling model multiplies
  them per rank (see systems/dungeons.yaml).
