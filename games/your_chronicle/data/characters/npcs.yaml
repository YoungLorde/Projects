    gives_main_quest: false
    appears_in_chapters: [5, 6]
    personality: Charismatic, opportunistic, generous to friends.
    voice_sample: "Every coin you don't invest is a soldier you didn't hire. Let me triple it for you."
    backstory: A caravan magnate who massively boosts trade income when delegated as a merchant and improves vendor prices.
    lore_notes: Merchant companion; raises currency income and vendor discounts.

  - id: CHR-NPC-020
    name: Sister Aveline Dawn
    title: Battle Priestess
    role: Recruitable Support
    role_category: faction
    importance: major
    persistence: recurring
    rarity: legendary
    recruitable: true
    can_level: true
    can_die: true
    archetype: scholar
    base_stats: {hp: 280, atk: 60, def: 80, spd: 55, vit: 130, int: 170, lck: 90, cha: 130, ldr: 80}
    faction: The Hollow Star Order
    home_location: Recruited via a hidden A-rank dungeon quest
    gives_main_quest: false
    appears_in_chapters: [5, 6]
    personality: Devout, fierce, compassionate.
    voice_sample: "The Hollow Star takes. I give back. Stand behind me and you will not fall today."
