    backstory: A physician who keeps your population healthy, slashing survival/disease losses when delegated as a medic.
    lore_notes: Medic companion; reduces survival-need failures and villager death.

  - id: CHR-NPC-019
    name: Rurik Goldhand
    title: Caravan Magnate
    role: Recruitable Merchant
    role_category: faction
    importance: minor
    persistence: recurring
    rarity: epic
    recruitable: true
    can_level: true
    can_die: true
    archetype: leader
    base_stats: {hp: 180, atk: 35, def: 50, spd: 50, vit: 65, int: 130, lck: 140, cha: 180, ldr: 110}
