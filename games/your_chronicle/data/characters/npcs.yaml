    base_stats: {hp: 220, atk: 35, def: 55, spd: 40, vit: 130, int: 80, lck: 70, cha: 70, ldr: 50}
    faction: Your Settlement
    home_location: Recruited at the homestead
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
