collection: support_npcs
description: >
  Support NPCs for Your Chronicle (names revamped; roster expanded to 30). Includes
  shop vendors, dungeon NPCs, service NPCs, and recruitable companions. Vendor
  shop_id values match data/shops/shops.yaml. New fields: rarity, recruitable,
  can_level, can_die, archetype, base_stats — so NPCs plug into recruitment,
  leveling, and permadeath. Recruited companions can be delegated to jobs.
characters:
  # ----------------------------- WEAPON VENDORS -----------------------------
  - id: CHR-NPC-001
    name: Thane Ironwood
    title: Master Weaponsmith
    role: Weapon Vendor
    role_category: vendor
    importance: major
    persistence: anchor
    rarity: epic
    recruitable: true
    can_level: true
    can_die: true
    archetype: artisan
    base_stats: {hp: 300, atk: 90, def: 80, spd: 35, vit: 75, int: 110, lck: 40, cha: 60, ldr: 55}
    faction: Frontier Adventurers' Guild
    shop_id: SHOP-WPN-01
    shop_type: weapons
    home_location: The Ironwood Smithy
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5, 6]
    personality: Loud, proud, treats every blade like a child going off to war.
    voice_sample: "Swing it once before you buy it. A weapon that doesn't feel right is just expensive regret."
    backstory: Thane Ironwood forges weapons that grow sharper with every deed of their wielder. Your main early/mid weapon shop and a recruitable master smith.
    lore_notes: Sells the standard weapon catalog (Tiers 0-4). Higher tiers via Vyssa.

  - id: CHR-NPC-002
    name: Vyssa Duskmarket
    title: Exotic Arms Dealer
    role: Weapon Vendor (High-Tier)
    role_category: vendor
    importance: minor
    persistence: recurring
    rarity: legendary
    recruitable: false
    can_level: false
    can_die: true
    archetype: rogue
    base_stats: {hp: 200, atk: 70, def: 50, spd: 110, vit: 55, int: 120, lck: 160, cha: 130, ldr: 60}
    faction: The Duskmarket Cartel
    shop_id: SHOP-WPN-02
    shop_type: weapons
    home_location: A black-market stall that relocates each phase
    gives_main_quest: false
    appears_in_chapters: [4, 5, 6]
    personality: Silky, secretive, sells things she probably shouldn't.
    voice_sample: "Legal? Darling, legality is just a law the empire hasn't gotten around to writing. The blade, or not?"
    backstory: Vyssa deals in rare, legendary, and faintly illegal armaments smuggled from deep dungeons. Stocks the high-tier weapon catalog.
    lore_notes: Sells legendary/mythic weapons (Tiers 5-9). Prices in Gold/Zenu.

  # ----------------------------- POTION VENDORS -----------------------------
  - id: CHR-NPC-003
    name: Goodwife Petra Bramble
    title: Apothecary
    role: Potion Vendor
    role_category: vendor
    importance: major
    persistence: anchor
    rarity: rare
    recruitable: true
    can_level: true
    can_die: true
    archetype: artisan
    base_stats: {hp: 180, atk: 25, def: 40, spd: 45, vit: 80, int: 130, lck: 60, cha: 90, ldr: 50}
    faction: Independent
    shop_id: SHOP-POT-01
    shop_type: potions
    home_location: The Bramble Apothecary, Market Row
    gives_main_quest: false
    appears_in_chapters: [1, 2, 3, 4, 5, 6]
    personality: Motherly, no-nonsense; will scold you for adventuring on an empty stomach.
    voice_sample: "Health potion, stamina draught, and a tonic for that cough. No, you're not leaving without the tonic."
    backstory: Petra Bramble runs the oldest apothecary on the frontier. Your main potion shop and a recruitable medic.
    lore_notes: Sells the standard potion catalog (restoratives, buffs, utility, survival meds).

  - id: CHR-NPC-004
    name: Old Mossfen
    title: Wild Herbalist & Tincture-Maker
    role: Potion Vendor (Tinctures)
    role_category: vendor
    importance: minor
    persistence: recurring
    rarity: rare
    recruitable: true
    can_level: true
    can_die: true
    archetype: scholar
    base_stats: {hp: 160, atk: 30, def: 35, spd: 40, vit: 65, int: 150, lck: 110, cha: 40, ldr: 40}
    faction: Independent
    shop_id: SHOP-POT-02
    shop_type: potions
    home_location: A moss-covered cart at the wilds' edge
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5]
    personality: Quiet, earthy; speaks more to his plants than to people.
    voice_sample: "...This one's for nightmares. This one's for courage. This one... best you don't ask."
    backstory: Old Mossfen forages rare reagents and brews potent tinctures the guild refuses to certify. Sells the advanced/forbidden potion catalog.
    lore_notes: Sells elixirs, exotic tinctures, forbidden brews.

  # ----------------------------- MATERIAL VENDORS -----------------------------
  - id: CHR-NPC-005
    name: Gareth Stonecount
    title: Material Broker
    role: Material Vendor
    role_category: vendor
    importance: major
    persistence: anchor
    rarity: rare
    recruitable: true
    can_level: true
    can_die: true
    archetype: leader
    base_stats: {hp: 200, atk: 35, def: 55, spd: 40, vit: 70, int: 120, lck: 70, cha: 120, ldr: 90}
    faction: The Duskmarket Cartel
    shop_id: SHOP-MAT-01
    shop_type: materials
    home_location: The Stonecount Exchange
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5, 6]
    personality: Shrewd, numbers-obsessed; never met a quantity he couldn't haggle.
    voice_sample: "Ore's up three points, hide's down two, and that crystal you're eyeing? Buy now or cry later."
    backstory: Gareth Stonecount runs the central material exchange that feeds every upgrade and recipe. Your main material shop.
    lore_notes: Sells the standard crafting-material catalog.

  - id: CHR-NPC-006
    name: Pell Deepvein
    title: Miner's Exchange Foreman
    role: Material Vendor (Ores/Gems)
    role_category: vendor
    importance: minor
    persistence: recurring
    rarity: uncommon
    recruitable: true
    can_level: true
    can_die: true
    archetype: laborer
    base_stats: {hp: 280, atk: 60, def: 70, spd: 35, vit: 95, int: 60, lck: 80, cha: 50, ldr: 45}
    faction: Frontier Adventurers' Guild
    shop_id: SHOP-MAT-02
    shop_type: materials
    home_location: The Mineshaft Depot
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
    personality: Booming, dust-covered; laughs at his own jokes.
    voice_sample: "Down here we say: rock today, riches tomorrow! ...Mostly rock, if I'm honest."
    backstory: Pell Deepvein runs the mining operation supplying rare ores, gems, and refined metals. Stocks the high-tier material catalog.
    lore_notes: Sells rare ores, gemstones, refined/exotic materials.

  # ----------------------------- SPECIALTY VENDORS -----------------------------
  - id: CHR-NPC-007
    name: Lior Glyphborne
    title: Court Enchanter
    role: Enchantment Vendor
    role_category: vendor
    importance: minor
    persistence: recurring
    rarity: epic
    recruitable: true
    can_level: true
    can_die: true
    archetype: scholar
    base_stats: {hp: 170, atk: 40, def: 45, spd: 50, vit: 60, int: 170, lck: 90, cha: 70, ldr: 60}
    faction: The Hollow Star Order
    shop_id: SHOP-ENC-01
    shop_type: enchantments
    home_location: The Glyphwright's Loft
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
    personality: Precise, vain about their craft, mildly snobbish.
    voice_sample: "Anyone can swing a sword. It takes an artist to make the sword want to swing itself."
    backstory: Lior Glyphborne inscribes runes and enchantments onto gear. Sells the enchantment/scroll catalog.
    lore_notes: Sells runes, glyph scrolls, enchantment stones.

  - id: CHR-NPC-008
    name: Madame Coralind Vex
    title: Relic Collector
    role: Artifact Vendor
    role_category: vendor
    importance: minor
    persistence: seasonal
    rarity: legendary
    recruitable: false
    can_level: false
    can_die: false
    archetype: rogue
    base_stats: {hp: 150, atk: 30, def: 40, spd: 80, vit: 50, int: 140, lck: 200, cha: 170, ldr: 60}
    faction: The Duskmarket Cartel
    shop_id: SHOP-REL-01
    shop_type: relics
    home_location: A traveling curiosity wagon (event windows only)
    gives_main_quest: false
    appears_in_chapters: [4, 5]
    personality: Theatrical; every item has an absurd backstory she swears is true.
    voice_sample: "This ring? Worn by a queen who could stop time! ...Or a cobbler with delusions. Either way — priceless."
    backstory: Madame Vex trades rare relics and prestige cosmetics during limited-time events. A SEASONAL vendor who vanishes between windows.
    lore_notes: SEASONAL/event vendor. Sells relics, charms, cosmetic Chronicle covers.

  # ----------------------------- DUNGEON NPCs -----------------------------
  - id: CHR-NPC-009
    name: Warden Korin Greymoor
    title: Gatekeeper of the Delves
    role: Dungeon Gatekeeper
    role_category: dungeon
    importance: major
    persistence: anchor
    rarity: epic
    recruitable: false
    can_level: false
    can_die: false
    archetype: warrior
    base_stats: {hp: 350, atk: 100, def: 110, spd: 45, vit: 90, int: 70, lck: 50, cha: 60, ldr: 80}
    faction: Frontier Adventurers' Guild
    home_location: The Delve Gate, beyond the wall
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5, 6]
    personality: Stern, watchful; treats dungeon safety like sacred law.
    voice_sample: "You go in at your own risk and come out at my discretion. Sign here. Try not to die — paperwork's a nightmare."
    backstory: Korin Greymoor controls access to every dungeon, gating content by power and phase. Hub for dungeon entry and rank selection.
    lore_notes: Dungeon-access hub. Sets dungeon ranks; unlocks new delves per phase.

  - id: CHR-NPC-010
    name: Scout Nyra Fairwind
    title: Wilds Pathfinder
    role: Dungeon Guide / Scout
    role_category: dungeon
    importance: minor
    persistence: recurring
    rarity: rare
    recruitable: true
    can_level: true
    can_die: true
    archetype: rogue
    base_stats: {hp: 190, atk: 70, def: 50, spd: 150, vit: 60, int: 80, lck: 130, cha: 70, ldr: 50}
    faction: Frontier Adventurers' Guild
    home_location: Forward camps inside dungeons
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5]
    personality: Quick, sharp; talks fast and moves faster.
    voice_sample: "Left's a trap, right's a worse trap, straight ahead's a boss. So — straight ahead, obviously."
    backstory: Nyra Fairwind guides adventurers through dungeon interiors, powering idle expeditions and run buffs. Recruitable scout.
    lore_notes: Dungeon shortcuts, trap warnings, idle-expedition speed bonuses.

  - id: CHR-NPC-011
    name: Cleric Edryn Vale
    title: Field Cleric of the Hollow Star
    role: Dungeon Healer / Revival
    role_category: dungeon
    importance: minor
    persistence: recurring
    rarity: rare
    recruitable: true
    can_level: true
    can_die: true
    archetype: scholar
    base_stats: {hp: 240, atk: 40, def: 70, spd: 45, vit: 110, int: 140, lck: 70, cha: 90, ldr: 60}
    faction: The Hollow Star Order
    home_location: Sanctuary shrines within dungeons
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
    personality: Gentle, weary; has seen too many adventurers not come back.
    voice_sample: "Rest at the shrine, friend. The dungeon can wait. The dead, unfortunately, cannot."
    backstory: Edryn Vale tends sanctuary shrines deep in the delves, offering healing, revival, and checkpoints. Recruitable healer.
    lore_notes: Dungeon revival/checkpoint service; reduces idle-run death penalties.

  # ----------------------------- SERVICE NPCs -----------------------------
  - id: CHR-NPC-012
    name: Barty Tallrow
    title: Bounty Clerk
    role: Bounty Board Service
    role_category: service
    importance: minor
    persistence: recurring
    rarity: uncommon
    recruitable: false
    can_level: false
    can_die: true
    archetype: scholar
    base_stats: {hp: 140, atk: 20, def: 30, spd: 45, vit: 50, int: 120, lck: 60, cha: 80, ldr: 50}
    faction: Frontier Adventurers' Guild
    home_location: The Bounty Desk, Guild Hall
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
    personality: Officious, paperwork-loving; secretly thrilled by every bounty he posts.
    voice_sample: "Bounty four-seven-two: one rampaging troll, alive or in pieces. Reward's generous. Form's in triplicate."
    backstory: Barty Tallow manages the bounty board — the repeatable/idle quest system converting time into reputation and currency.
    lore_notes: Repeatable bounty/idle-quest hub; drives the side-quest reward loop.

  - id: CHR-NPC-013
    name: Mabel Hearthwell
    title: Keeper of the Roadside Inn
    role: Tavern Keeper / Rumors
    role_category: service
    importance: minor
    persistence: anchor
    rarity: uncommon
    recruitable: true
    can_level: true
    can_die: true
    archetype: leader
    base_stats: {hp: 200, atk: 30, def: 45, spd: 40, vit: 80, int: 90, lck: 80, cha: 150, ldr: 80}
    faction: Independent
    home_location: The Roadside Inn, Market Row
    gives_main_quest: false
    appears_in_chapters: [1, 2, 3, 4, 5, 6]
    personality: Warm, gossipy; knows everyone's business and most of their secrets.
    voice_sample: "Sit, eat, drink. And while you're at it — let me tell you what the whole frontier's whispering about you."
    backstory: Mabel Hearthwell runs the inn where adventurers rest. Provides rested/idle buffs and rumors hinting at hidden content. Recruitable.
    lore_notes: Rested/idle buffs; rumor-based hints toward secrets.

  - id: CHR-NPC-014
    name: Master Coffer Aldric Vane
    title: Treasurer of the Frontier Ledger Bank
    role: Banker / Treasury & Refining
    role_category: service
    importance: minor
    persistence: recurring
    rarity: rare
    recruitable: false
    can_level: false
    can_die: false
    archetype: scholar
    base_stats: {hp: 160, atk: 20, def: 40, spd: 35, vit: 55, int: 160, lck: 90, cha: 110, ldr: 70}
    faction: The Iron Crown
    home_location: The Ledger Bank
    gives_main_quest: false
    appears_in_chapters: [3, 4, 5, 6]
    personality: Impeccable, precise; treats currency with religious reverence.
    voice_sample: "Idle wealth is wasted wealth. Deposit, refine, and let it compound while you sleep."
    backstory: Aldric Vane runs the bank where players store currency for idle interest and refine coins up the tier chain (Zenu/Mythril).
    lore_notes: Idle-interest hub AND currency-refining station. Core to the auto-conversion economy.

  - id: CHR-NPC-015
    name: Pip Roamfoot
    title: The Wandering Merchant
    role: Random Traveling Vendor
    role_category: vendor
    importance: minor
    persistence: transient
    rarity: rare
    recruitable: false
    can_level: false
    can_die: false
    archetype: rogue
    base_stats: {hp: 150, atk: 40, def: 35, spd: 120, vit: 50, int: 100, lck: 180, cha: 140, ldr: 50}
    faction: Independent
    shop_id: SHOP-WND-01
    shop_type: wandering
    home_location: Appears randomly at any hub for a limited time
    gives_main_quest: false
    appears_in_chapters: [2, 3, 4, 5, 6]
    personality: Cheery, unpredictable; never sells the same thing twice.
    voice_sample: "Catch me while you can! Here today, gone in an hour, deal of a lifetime in between!"
    backstory: Pip Roamfoot appears at random with a rotating stock pulled from every shop type. A TRANSIENT vendor rewarding frequent idle check-ins.
    lore_notes: TRANSIENT random vendor; rotating curated mix from all catalogs.

  # ----------------------------- RECRUITABLE COMPANIONS / NEW NPCs -----------------------------
  - id: CHR-NPC-016
    name: Kael Stormborn
    title: Frontier Swordsman
    role: Recruitable Warrior
    role_category: faction
    importance: major
    persistence: recurring
    rarity: epic
    recruitable: true
    can_level: true
    can_die: true
