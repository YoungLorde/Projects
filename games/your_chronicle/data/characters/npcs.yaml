    importance: minor
    persistence: recurring
    rarity: uncommon
    recruitable: false
    can_level: false
    can_die: true
    archetype: laborer
    base_stats: {hp: 200, atk: 40, def: 60, spd: 35, vit: 90, int: 70, lck: 60, cha: 50, ldr: 40}
